<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css"><script src="timeline.js"></script>
<style>
  .nt { position: absolute; left: 640px; width: 200px; font-size: 13px; color: var(--muted); padding-left: 14px; }
  .nt::before { content: ""; position: absolute; left: 0; top: 10px; width: 8px; height: 1px; background: var(--muted); }
  #ans { position: absolute; left: 32px; top: 116px; width: 560px; line-height: 28px; }
  .cite { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; margin: 0 2px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font: 600 12px/1 var(--ui); vertical-align: 1px; }
  .rc { height: 26px; font-weight: 500; }
</style></head>
<body><div id="stage">
  <div id="user" class="abs" style="right:288px;top:24px;max-width:360px;padding:8px 14px;border-radius:14px;background:var(--subtle)">이 책 3장을 요약해 줘</div>
  <div id="stat" class="abs small muted" style="left:32px;top:84px;display:flex;align-items:center;gap:8px"><span id="statText">읽는 중 · 3장 42~57쪽</span><span id="dots" style="display:inline-flex;gap:4px"><i></i><i></i><i></i></span></div>
  <div id="ans"></div>
  <div id="info" class="abs small muted" style="left:32px;top:218px;display:flex;align-items:center;gap:8px"><span>확인하지 못한 내용: 저자 인터뷰 인용은 책에 없어요</span></div>
  <div id="fb" class="abs" style="left:32px;top:252px;display:flex;align-items:center;gap:14px;color:var(--muted)"><span style="width:1px;height:16px;background:var(--line)"></span><span class="chip gray">정확해요</span><span class="chip gray">출처가 틀려요</span><span class="chip gray">너무 길어요</span></div>
  <div class="field abs" style="left:32px;top:350px;width:560px;height:44px;border-radius:12px"></div>
  <div id="stop" class="btn" style="position:absolute;right:300px;top:357px;height:30px;font-size:13px;padding:0 12px;border-radius:8px"><span style="display:flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border:1.5px solid currentColor;border-radius:2px"></i>중지</span></div>
  <div id="regen" class="btn" style="position:absolute;right:300px;top:357px;height:30px;font-size:13px;padding:0 12px;border-radius:8px">다시 생성 · 1/2</div>
  <div id="n1" class="nt" style="top:354px">중지할 수 있어요</div>
  <div id="n2" class="nt" style="top:122px">주장마다 출처</div>
  <div id="n3" class="nt" style="top:216px">모르는 건 모른다고</div>
  <div id="n4" class="nt" style="top:252px">버전 보존 · 이유 있는 피드백</div>
</div>
<script>
const S = (d) => svg(d, 'style="width:16px;height:16px"');
const infoI = S('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>');
const up = S('<path d="M7 10v11M15 5.9L14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 8a2 2 0 0 1-1.9 1.4H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.8a2 2 0 0 0 1.8-1.1L12 2a3.1 3.1 0 0 1 3 3.9z"/>');
const down = S('<path d="M17 14V3M9 18.1L10 14H4.2a2 2 0 0 1-1.9-2.6l2.3-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.8a2 2 0 0 0-1.8 1.1L12 22a3.1 3.1 0 0 1-3-3.9z"/>');
$("info").insertAdjacentHTML("afterbegin", infoI);
$("fb").insertAdjacentHTML("afterbegin", up + down);
document.querySelectorAll("#dots i").forEach((d) => { d.style.cssText = "width:5px;height:5px;border-radius:50%;background:var(--muted);display:block"; });
// 답변: 글자 수 기준으로 스트리밍, 인용은 자리 1칸을 차지하며 닿는 순간 칩으로 등장
const PARTS = ["3장은 주인공이 처음으로 스스로 선택하는 장면을 다뤄요 ", { c: "42쪽" }, ". 저자는 이 선택을 성장의 시작으로 봐요 ", { c: "57쪽" }, "."];
const TOTAL = PARTS.reduce((n, p) => n + (typeof p === "string" ? p.length : 1), 0);
const S0 = 2000, S1 = 6000;
function renderAns(t) {
  const n = clamp((t - S0) / (S1 - S0), 0, 1) * TOTAL;
  let pos = 0, html = "";
  PARTS.forEach((p) => {
    if (typeof p === "string") {
      const k = Math.floor(clamp(n - pos, 0, p.length));
      html += p.slice(0, k) + `<span class="hide">${p.slice(k)}</span>`; pos += p.length;
    } else {
      const o = easeOutCubic(progress(t, S0 + pos / TOTAL * (S1 - S0), 240));
      html += `<span class="cite" style="opacity:${o}">[${p.c}]</span>`; pos += 1;
    }
  });
  $("ans").innerHTML = html;
}
window.DEMO = defineDemo({ width: 880, height: 420, end: 7800,
  draw(t) {
    fade($("user"), t, 300);
    fade($("stat"), t, 1000);
    document.querySelectorAll("#dots i").forEach((d, i) => { d.style.opacity = t < 6000 ? (Math.floor(t / 250) % 3 === i ? 1 : 0.3) : 0; });
    $("statText").textContent = t < 6000 ? "읽는 중 · 3장 42~57쪽" : "읽음 · 3장 42~57쪽";
    renderAns(t);
    fade($("stop"), t, 2000, 240, 6000); fade($("regen"), t, 6000);
    fade($("info"), t, 6400); fade($("fb"), t, 7200);
    [["n1", 2400], ["n2", 3600], ["n3", 6400], ["n4", 7200]].forEach(([id, s]) => fade($(id), t, s));
  } });
</script></body></html>
