<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="wire.css"><script src="timeline.js"></script><script src="wire.js"></script>
<style>
  /* 고치기 전 저대비 글자색: 테마마다 배경 대비 2.6:1 근처로 정한다(라이트 2.64 · 다크 2.62). */
  :root[data-theme="light"] { --low: #9aa0a6; }
  :root[data-theme="dark"] { --low: #50585f; }
  .grp { position: absolute; right: 16px; display: flex; }
  .tb { display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; flex: none; }
  .clip { position: absolute; left: 0; right: 0; top: 136px; bottom: 0; overflow: hidden; }
  .scr { position: absolute; left: 0; top: -136px; width: 100%; height: 464px; }
  .at { position: absolute; left: 16px; right: 16px; }
  .hint { font: 400 13px/24px var(--ui); color: var(--muted); }
  .lk { position: absolute; right: 16px; font: 400 13px/24px var(--ui); text-decoration: underline; }
  .row { height: 44px; display: flex; align-items: center; gap: 12px; font: 400 13px/20px var(--ui); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; border-top: 1px solid var(--line); background: var(--bg); }
  .bar .w-btn { position: absolute; right: 16px; top: 11px; width: 120px; }
  .ring { position: absolute; outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .ghost { position: absolute; color: var(--muted); }
  .ghost .w-check { outline: 2px dashed var(--accent); outline-offset: 2px; border-radius: 4px; }
  .circ { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 1px dashed var(--muted); border-radius: 50%; }
  .w-vrow .chip { margin-left: 4px; }
  .w-vrow .sb { font: 400 13px/18px var(--ui); color: var(--muted); }
</style></head>
<body><div id="stage">
  <div id="ba" class="w-ba" style="left:40px;top:16px"><span id="chB" class="chip before">고치기 전</span><span id="chA" class="chip after">고친 후</span></div>
</div>
<script>
const DX = 40, DY = 56, DEV_H = 464, W_ = 880, H_ = 544, SCROLL = 64;
const ICONS = ["search", "info", "more"];
const grp = (id, size, glyph, top) => `<span class="grp" id="${id}" style="top:${top}px">${ICONS.map((n, k) => `<span class="tb" ${k === 0 ? `id="${id}0"` : ""} style="width:${size}px;height:${size}px">${W.icon(n, glyph)}</span>`).join("")}</span>`;
const fld = (label, value, top) => `<div class="at w-field" style="top:${top}px"><div class="lb">${label}</div><div class="bx">${value}</div></div>`;
const inner = W.statusBar() + `<div class="w-appbar" style="position:relative"><span class="t">배송지</span>${grp("gB", 20, 16, 14)}${grp("gA", 44, 24, 2)}</div>
  <div class="at hint" style="top:108px">받는 분 정보를 입력해 주세요</div>
  <span class="lk" id="lkB" style="top:108px;color:var(--low)">도움말</span><span class="lk" id="lkA" style="top:108px;color:var(--accent)">도움말</span>
  <div class="clip"><div class="scr" id="scr">
    ${fld("받는 분", "김하늘", 148)}${fld("연락처", "010-1234-5678", 232)}${fld("배송 메모", "문 앞에 놓아 주세요", 316)}
    <div class="at row" id="row" style="top:404px"><span class="w-check" id="ck"></span><span>기본 배송지로 저장</span></div>
    <div class="ring" id="ring"></div>
  </div></div>
  <div class="bar">${W.button("다음", { kind: "primary" })}</div>`;
const stage = $("stage");
stage.insertAdjacentHTML("beforeend", W.device(inner, { id: "dev", x: DX, y: DY, h: DEV_H }));

// 실측: 점선·핀·치수선·원은 기기 안 부품의 모서리와 중심에서 계산한다.
const rc = (id) => W.rect($(id));
const R = { g0: rc("gB0"), gB: rc("gB"), gA: rc("gA"), gA0: rc("gA0"), lk: rc("lkB"), row: rc("row") };
const LKF = { left: R.lk.left - 8, top: R.lk.top - 4, width: R.lk.width + 16, height: R.lk.height + 8 }; // 링크 둘레 여유
const F = [R.gB, LKF, R.row], FP = [4, 6, 6]; // 점선 대상과 간격
const pinAt = (c, n, id) => `<div class="num" id="${id}" style="left:${c.x - 10}px;top:${c.y - 10}px">${n}</div>`;
const cornerB = F.map((r, i) => ({ x: r.left - FP[i] - 10, y: r.top - FP[i] - 6 }));
const cornerA = [R.gA, R.lk, { ...R.row, top: R.row.top - SCROLL }].map((r) => W.pinCenter(r));

// 대비 비율: 그려진 글자색과 배경색에서 직접 계산한다.
const rgb = (c) => c.match(/\d+/g).slice(0, 3).map(Number);
const hex = (c) => "#" + rgb(c).map((v) => v.toString(16).padStart(2, "0")).join("");
const lum = (c) => { const [r, g, b] = rgb(c).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const bg = getComputedStyle($("dev")).backgroundColor;
const cmp = (id) => { const c = getComputedStyle($(id)).color; return `${hex(c)} / ${hex(bg)} = ${ratio(c, bg).toFixed(1)}:1`; };

const NUM_X = 376, YB = [64, 116, 168], YA = [256, 308, 360];
const num = (id, n, top) => `<div id="${id}" class="num" style="left:${NUM_X}px;top:${top + 2}px">${n}</div>`;
const row = (id, top, l, name, chip, sb) => `<div id="${id}" class="w-vrow" style="top:${top}px"><span class="l">${l}</span><span class="v"><div>${name} ${chip}</div><div class="sb">${sb}</div></span></div>`;
const FAIL = `<span class="chip p1">FAIL</span>`, PASS = `<span class="chip ok">PASS</span>`;
const circ = [0, 1, 2].map((k) => ({ x: R.g0.left + 10 + 20 * k, y: R.g0.top + 10 }));
const tick = (x, y) => `<i class="w-dim" style="left:${x}px;top:${y}px;width:1px;height:8px"></i>`;
// 20은 라벨(24)이 선(20)보다 넓어 선 오른쪽 끝 밖에 둔다.
const dim20 = `${W.ext({ axis: "v", at: R.g0.left, from: R.g0.bottom, to: R.g0.bottom + 8 })}${W.ext({ axis: "v", at: R.g0.right - 1, from: R.g0.bottom, to: R.g0.bottom + 8 })}` +
  W.dim({ axis: "h", at: R.g0.bottom + 8, from: R.g0.left, to: R.g0.right - 1, label: "" }).replace(/<span class="w-dim lb"[^>]*><\/span>/, "") +
  `<span class="w-dim lb" style="left:${R.g0.right + 3}px;top:${R.g0.bottom}px">20</span>`;
const dim44 = `${W.ext({ axis: "v", at: R.gA0.left, from: R.gA0.bottom, to: R.gA0.bottom + 8 })}${W.ext({ axis: "v", at: R.gA0.right - 1, from: R.gA0.bottom, to: R.gA0.bottom + 8 })}` +
  W.dim({ axis: "h", at: R.gA0.bottom + 8, from: R.gA0.left, to: R.gA0.right - 1, label: "44" });
stage.insertAdjacentHTML("beforeend",
  `<div id="circ">${circ.map((c) => `<i class="circ" style="left:${c.x}px;top:${c.y}px"></i>`).join("")}</div>` +
  `<div id="dB">${dim20}</div><div id="dA">${dim44}</div>` +
  `<div id="gh" class="ghost row" style="left:${R.row.left}px;top:${R.row.top}px;width:${R.row.width}px"><span class="w-check"></span><span>기본 배송지로 저장</span></div>` +
  W.flag(F[0], { id: "fl0", pad: FP[0] }) + W.flag(F[1], { id: "fl1", pad: FP[1] }) + W.flag(F[2], { id: "fl2", pad: FP[2] }) +
  cornerB.map((c, i) => pinAt(c, i + 1, "pb" + i)).join("") + cornerA.map((c, i) => pinAt(c, i + 1, "pa" + i)).join("") +
  [0, 1, 2].map((i) => num("nb" + i, i + 1, YB[i]) + num("na" + i, i + 1, YA[i])).join("") +
  row("vb0", YB[0], "아이콘", "2.5.8 대상 크기(최소) · AA", FAIL, "KWCAG 6.1.3 · 20×20px · 24px 원이 겹쳐요") +
  row("vb1", YB[1], "링크", "1.4.3 명도 대비 · AA", FAIL, `KWCAG 5.4.3 · ${cmp("lkB")} · 기준 4.5:1`) +
  row("vb2", YB[2], "포커스", "2.4.11 포커스 가려짐(최소) · AA", FAIL, "고정 막대에 포커스가 완전히 가려져요") +
  `<div id="hr" class="hr" style="left:${NUM_X}px;width:${840 - NUM_X}px;top:232px"></div>` +
  row("va0", YA[0], "아이콘", "2.5.8 대상 크기(최소) · AA", PASS, "KWCAG 6.1.3 · 44×44px · 기준 24×24px") +
  row("va1", YA[1], "링크", "1.4.3 명도 대비 · AA", PASS, `KWCAG 5.4.3 · ${cmp("lkA")} · 기준 4.5:1`) +
  row("va2", YA[2], "포커스", "2.4.11 포커스 가려짐(최소) · AA", PASS, "스크롤 여백 72px · 고정 막대 위로 포커스가 보여요"));

// 포커스 링 좌표(내용 좌표): 입력칸 상자 셋과 체크박스
const sc = W.rect($("scr"));
const at = (el) => { const r = W.rect(el); return { x: r.left - sc.left, y: r.top - sc.top, w: r.width, h: r.height }; };
const FOCUS = [...document.querySelectorAll(".scr .w-field .bx")].map(at).concat([at($("ck"))]);
const ringTo = (t, stops) => { // stops: [[시각, FOCUS 인덱스], ...] 사이를 280ms로 옮긴다
  let i = 0; stops.forEach(([s], j) => { if (t >= s) i = j; });
  const from = FOCUS[stops[Math.max(0, i - 1)][1]], to = FOCUS[stops[i][1]], p = i === 0 ? 1 : easeOutCubic(progress(t, stops[i][0], 280));
  const l = (k) => from[k] + (to[k] - from[k]) * p, ring = $("ring");
  ring.style.left = l("x") + "px"; ring.style.top = l("y") + "px"; ring.style.width = l("w") + "px"; ring.style.height = l("h") + "px";
};

// 타임라인(ms): 고치기 전 세 건을 차례로 찾고 → SWAP에서 같은 기기를 고치고 → 세 건 PASS
const SWAP = 7000, OUT = SWAP - 200;
window.DEMO = defineDemo({ width: W_, height: H_, end: 10200,
  draw(t) {
    fade($("dev"), t, 200, 300);
    const sw = easeOutCubic(progress(t, SWAP, 240)), on = progress(t, 200, 240);
    opacityAt($("chB"), Math.min(on, 1 - sw)); opacityAt($("chA"), Math.min(on, sw));
    // ① 아이콘 버튼: 24px 원이 겹침 → 20 치수 → 점선 → 판정
    opacityAt($("circ"), easeOutCubic(progress(t, 900, 240)) * (1 - progress(t, OUT, 180)));
    document.querySelectorAll(".circ").forEach((c) => { c.style.borderColor = t >= 1400 ? "var(--p1)" : "var(--muted)"; });
    fade($("dB"), t, 1700, 240, OUT);
    fade($("fl0"), t, 2100, 240, OUT); fade($("pb0"), t, 2300, 200, OUT);
    fade($("nb0"), t, 2500); fade($("vb0"), t, 2500);
    // ② 도움말 링크 명도 대비
    fade($("fl1"), t, 3300, 240, OUT); fade($("pb1"), t, 3500, 200, OUT);
    fade($("nb1"), t, 3700); fade($("vb1"), t, 3700);
    // ③ 키보드 포커스: 입력칸을 지나 체크박스로 가면 고정 막대 뒤로 사라진다
    ringTo(t, t < SWAP ? [[4300, 1], [4700, 2], [5100, 3]] : [[8000, 2], [8500, 3]]);
    opacityAt($("ring"), t < SWAP ? progress(t, 4300, 160) * (1 - progress(t, OUT, 100)) : progress(t, 8000, 160));
    fade($("gh"), t, 5700, 240, OUT);
    fade($("fl2"), t, 5700, 240, OUT); fade($("pb2"), t, 5900, 200, OUT);
    fade($("nb2"), t, 6100); fade($("vb2"), t, 6100);
    // 같은 기기에서 고치기: 터치 영역 44 · 링크 색 · 스크롤 여백
    opacityAt($("gB"), 1 - sw); opacityAt($("gA"), sw);
    opacityAt($("lkB"), 1 - sw); opacityAt($("lkA"), sw);
    fade($("hr"), t, SWAP);
    $("scr").style.transform = `translateY(${-SCROLL * easeOutCubic(progress(t, 8500, 400))}px)`;
    fade($("dA"), t, 7400); fade($("pa0"), t, 7400, 200); fade($("na0"), t, 7600); fade($("va0"), t, 7600);
    fade($("pa1"), t, 8000, 200); fade($("na1"), t, 8200); fade($("va1"), t, 8200);
    fade($("pa2"), t, 9100, 200); fade($("na2"), t, 9300); fade($("va2"), t, 9300);
  } });
</script></body></html>
