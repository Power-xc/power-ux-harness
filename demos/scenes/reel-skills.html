<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css"><script src="timeline.js"></script>
<style>
  #chips { position: absolute; left: 0; top: 0; width: 480px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .sc { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; font: 500 15px/1.3 var(--mono); color: var(--accent); white-space: nowrap; }
</style></head>
<body><div id="stage"><div id="chips"></div></div>
<script>
const IDS = ["ux-simulate", "ux-research", "ux-flow", "ux-spec", "ux-writing", "ux-review", "ux-a11y", "ux-dark-patterns", "ux-metrics", "ux-ai"];
const els = IDS.map((s) => { const e = document.createElement("span"); e.className = "sc"; e.textContent = s; $("chips").appendChild(e); return e; });
window.DEMO = defineDemo({ width: 480, height: 230, end: 3000,
  draw(t) { els.forEach((e, i) => fade(e, t, i * 220)); } });
</script></body></html>
