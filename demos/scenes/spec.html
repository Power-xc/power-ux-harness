<!doctype html>

<link rel="stylesheet" href="shared.css"><script src="timeline.js"></script>

<body><div id="stage">
  <div id="head" class="abs" style="left:40px;top:20px;display:flex;gap:12px;align-items:baseline"><span class="mono" style="font-size:13px;font-weight:600">SCR-SUB-03</span><span style="font-weight:600">구독 해지 확인</span><span class="small muted">v1.2</span></div>

  <div id="r3" class="sr" style="top:184px"><span class="n">3</span><div><span class="k">로딩 버튼</span> · <span id="t3"></span></div></div>

<script>
const TXT = ["“구독을 해지할까요?” · 본문 “해지해도 11월 30일까지 쓸 수 있어요”", "“닫기” / “해지하기” — 같은 크기, 결과 동사", "처리 중 중복 제출 막기 · 실패하면 인라인 오류와 다시 시도", "“구독을 해지했어요” + “되돌리기” · 다음 결제일 전까지"];
// 1행 접두어는 "대화상자 · 제목 …"
TXT[0] = "제목 " + TXT[0];
const S = [1000, 2200, 3400, 4600];
window.DEMO = defineDemo({ width: 880, height: 420, end: 7900,
  draw(t) {
    fade($("head"), t, 300);
    S.forEach((s, i) => {
      fade($("c" + (i + 1)), t, s); fade($("r" + (i + 1)), t, s);
      typeInto($("t" + (i + 1)), TXT[i], t, s, 30, false);
    });
    fade($("hr"), t, 5800);
    fade($("m1"), t, 5800); fade($("m2"), t, 6600); fade($("m3"), t, 7400);
  } });
