  .row.done { opacity: .5; } .row.done .dot { border-color: var(--ok); } .row.done .dot i { opacity: 1; }

  { step: "검토", id: "ux-review", req: "삭제를 토스트로만 알리는데 되돌리기를 줄지",

        <div id="rl" class="a0" style="left:0;top:50px;width:216px;border-bottom:1px solid var(--line)">
          <div class="li" style="height:44px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px"><span>데미안 — 3장 메모</span><span class="muted" style="font-size:12px">삭제</span></div>
          <div id="r2" style="height:44px;overflow:hidden;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;white-space:nowrap"><span>어린 왕자 — 문장 모음</span><span class="muted" style="font-size:12px">삭제</span></div>
          <div class="li" style="height:44px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px"><span>코스모스 — 질문 목록</span><span class="muted" style="font-size:12px">삭제</span></div>
        </div>
        <div id="rrip" class="ripple" style="left:195px;top:116px"></div><div id="rrip2" class="ripple" style="left:186px;top:355px"></div>
        <div id="toast" class="a0 field" style="left:0;top:340px;width:216px;height:36px;display:flex;align-items:center;padding:0 12px;font-size:13px">삭제되었습니다</div>
        <div id="snack" class="a0 field" style="left:0;top:340px;width:216px;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px"><span>노트를 삭제했어요</span>${O("되돌리기")}</div>`,
    rb: [0, 334, 216, 48], ra: [0, 334, 216, 48] },
  { step: "접근성", id: "ux-a11y", req: "터치 영역 크기",
    pat: "Target size · WCAG 2.5.8",
    bt: "아이콘 버튼 3개가 20×20px로 붙어 있음",
    at: "버튼마다 44×44px 누르는 영역, 간격 확보",
    custom: "a11y", S: 1250,
    b: `<div id="ibar" class="a0" style="left:0;top:110px;width:216px;display:flex;justify-content:center;align-items:center"><span class="ibtn">${ic.heart}</span><span class="ibtn">${ic.share}</span><span class="ibtn">${ic.trash}</span></div><div id="icap" class="a0 cap" style="left:0;top:182px;width:216px;text-align:center">20×20px</div>`,
    rb: [60, 100, 96, 40], ra: [20, 100, 176, 60] },
  { step: "기만 패턴", id: "ux-dark-patterns", req: "부가 서비스가 기본으로 체크돼 있는데 괜찮아?",
    pat: "사전 선택 · 공정위 다크패턴 유형",

    custom: "dark", S: 1250,

        <div class="a0" style="left:10px;top:176px;width:196px"><span class="btn primary full">다음</span></div>`,
    rb: [0, 98, 216, 48], ra: [0, 98, 216, 48] },
  { step: "측정", id: "ux-metrics", req: "성공 지표 정해 줘",
    pat: "Vanity metric → Success metric + Guardrail",
    bt: "페이지뷰 · 클릭 수 · 체류 시간",
    at: "주 지표 「첫 주문 완료율」 · 가드레일 「오류 문의 수」",
    b: `<div class="a0 fl" style="left:10px;top:76px;width:196px;line-height:2.1">페이지뷰<br>클릭 수<br>체류 시간</div>`,
    a: `<div class="a0" style="left:10px;top:76px"><span class="chip accent">주 지표</span></div><div class="a0 big" style="left:10px;top:106px">첫 주문 완료율</div><div class="a0" style="left:10px;top:164px"><span class="chip gray">가드레일</span></div><div class="a0 big" style="left:10px;top:194px">오류 문의 수</div>`,
    rb: [0, 62, 216, 114], ra: [0, 62, 216, 176] },
  { step: "AI", id: "ux-ai", req: "답변에 출처랑 다시 생성 버튼을 어떻게 넣을지",
    pat: "Source · Stop · Regenerate",
    bt: "AI 답이 출처 없이 단정하고 멈출 버튼 없음",
    at: "출처 칩 + [중지] / [다시 생성] + 「AI 답은 틀릴 수 있어요」",
    b: `<div class="a0 fl" style="left:10px;top:84px;width:196px">이 기능은 모든 요금제에서 쓸 수 있습니다.</div>`,
    a: `<div class="a0 fl" style="left:10px;top:70px;width:196px">이 기능은 모든 요금제에서 쓸 수 있습니다.</div><div class="a0" style="left:10px;top:124px;display:flex;gap:6px"><span class="chip gray">출처 1</span><span class="chip gray">출처 2</span></div><div class="a0" style="left:10px;top:162px;width:196px;display:flex;gap:8px"><span class="btn" style="flex:1;height:32px;padding:0 8px">중지</span><span class="btn" style="flex:1.4;height:32px;padding:0 8px">다시 생성</span></div><div class="a0 cap" style="left:10px;top:206px;width:196px;font-family:var(--ui)">AI 답은 틀릴 수 있어요</div>`,
    rb: [0, 70, 216, 60], ra: [0, 58, 216, 180] },
];

const T0 = 300, PER = 2400, N = SK.length, STEP_Y = 80, PITCH = 44, DEF_S = 1250;
const stage = $("stage");
const ease = easeOutCubic;
SK.forEach((s, i) => {
  const row = document.createElement("div");
  row.className = "row"; row.style.top = (STEP_Y + i * PITCH) + "px";
  row.innerHTML = `<span class="dot"><i></i></span><span class="step">${s.step}</span><span class="sid">${s.id}</span>`;
  stage.appendChild(row); s.row = row;

  const pane = document.createElement("div");
  pane.className = "pane";
  pane.innerHTML = `<div class="lay lb">${s.b}</div>${s.a ? `<div class="lay la">${s.a}</div>` : ""}<div class="ring"></div>`;
  stage.appendChild(pane); s.pane = pane;

  const side = document.createElement("div");
  side.className = "side";
  side.innerHTML = `<div class="pat">${s.pat}</div>
    <div class="blk bb" style="top:118px"><span class="chip p1">고치기 전</span><div>${s.bt}</div></div>
    <div class="blk ba" style="top:236px"><span class="chip ok">고친 후</span><div>${s.at}</div></div>`;
  stage.appendChild(side); s.side = side;
});

const custom = {
  spec(u, s, S) {
    const btn = $("sbtn"), cap = $("scap"), chips = $("schips").children;
    const k = u < S ? -1 : Math.min(3, Math.floor((u - S) / 280));
    const ST = [["저장", "primary", ""], ["저장하는 중…", "", "var(--muted)"], ["저장했어요", "", "var(--ok)"], ["저장하지 못했어요", "", "var(--p1)"]];
    if (k < 0) { btn.textContent = "저장"; btn.style.cssText = ""; btn.className = "btn full"; cap.textContent = "누르면 저장"; }
    else {
      btn.textContent = ST[k][0]; btn.className = "btn full " + ST[k][1];
      btn.style.cssText = ST[k][2] ? `color:${ST[k][2]};border-color:${ST[k][2]}` : "";
      cap.textContent = ["기본", "로딩", "완료", "실패"][k];
    }
    opacityAt($("schips"), k < 0 ? 0 : progress(u, S, 200));
    [...chips].forEach((c, j) => { c.className = "chip " + (j === k ? ["accent", "accent", "ok", "p1"][j] : "gray"); c.style.opacity = j === k ? 1 : 0.55; });
  },
  review(u, s, S) {
    const ROW = 44, r2 = $("r2");
    // 1차(Toast): 삭제 350, 접힘 400~640, 토스트 600~1150, 초기화 1250~1500
    // 2차(Snackbar): 삭제 1400, 접힘 1450~1670, 스낵바 1550~, 되돌리기 1950, 복구 2000~2200
    let h = ROW;
    if (u >= 2000) h = ROW * ease(progress(u, 2000, 200));
    else if (u >= 1450) h = ROW * (1 - ease(progress(u, 1450, 220)));
    else if (u >= 1150) h = ROW * ease(progress(u, 1150, 180));
    else if (u >= 400) h = ROW * (1 - ease(progress(u, 400, 240)));
    r2.style.height = h + "px"; r2.style.opacity = h / ROW; r2.style.borderTopWidth = h < 1 ? 0 : 1;
    fade($("toast"), u, 600, 220, 1100, 160);
    fade($("snack"), u, 1550, 220, 2200, 160);
    const rp = (st) => { const p = progress(u, st, 320); return p > 0 && p < 1 ? p : null; };
    const p1 = rp(350), p2 = rp(1400), p3 = rp(1950);
    $("rrip").style.opacity = p1 !== null ? 1 - p1 : p2 !== null ? 1 - p2 : 0;
    $("rrip").style.transform = `scale(${1 + 2.2 * ease(p1 ?? p2 ?? 0)})`;
    $("rrip2").style.opacity = p3 !== null ? 1 - p3 : 0;
    $("rrip2").style.transform = `scale(${1 + 2.2 * ease(p3 ?? 0)})`;
  },
  a11y(u, s, S) {
    const p = ease(progress(u, S, 420)), size = lerp(20, 44, p), gap = lerp(2, 8, p);
    const bar = $("ibar"); bar.style.gap = gap + "px";
    [...bar.children].forEach((b) => { b.style.width = b.style.height = size + "px"; b.style.borderColor = p < 0.02 ? "transparent" : "var(--line)"; b.style.opacity = 1; });
    $("icap").textContent = u < S + 200 ? "20×20px" : "44×44px";
  },
  dark(u, s, S) {
    const p = progress(u, S + 80, 220);
    $("ck").style.opacity = 1 - p;
  },
};
const lerpRect = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));

window.DEMO = defineDemo({ width: 880, height: 560, end: T0 + PER * N,
  draw(t) {
    $("brand").textContent = BRAND;
    const idx = Math.min(N - 1, Math.max(0, Math.floor((t - T0) / PER)));
    SK.forEach((s, i) => {
      const start = T0 + PER * i, u = t - start;
      s.row.className = "row" + (t < start ? "" : i === idx && u < PER ? " on" : " done");
      if (i === N - 1 && t >= start) s.row.className = "row on";
      const last = i === N - 1, S = s.S || DEF_S;
      const outAt = last ? Infinity : PER - 170;
      fade(s.pane, u, 140, 220, outAt, 170, 4);
      fade(s.side, u, 140, 220, outAt, 170, 4);
      if (u < 0 || u > PER) return;
      const lb = s.pane.querySelector(".lb"), la = s.pane.querySelector(".la"), ring = s.pane.querySelector(".ring");
      const pc = ease(progress(u, S, 260));
      if (la) { opacityAt(lb, 1 - pc); opacityAt(la, pc); }
      if (custom[s.custom]) custom[s.custom](u, s, S);
      const r = lerpRect(s.rb, s.ra, pc);
      ring.style.left = r[0] + "px"; ring.style.top = r[1] + "px"; ring.style.width = r[2] + "px"; ring.style.height = r[3] + "px";
      ring.style.borderColor = u < S ? "var(--p1)" : "var(--ok)";
      opacityAt(ring, u < S ? progress(u, 480, 200) : Math.max(progress(u, S + 40, 200), 0.001));
      const bb = s.side.querySelector(".bb"), ba = s.side.querySelector(".ba");
      fade(bb, u, 520, 220); bb.style.opacity = bb.style.opacity * (1 - 0.55 * progress(u, S, 200));
      fade(ba, u, S + 40, 220);
    });
    const u0 = t - (T0 + PER * idx);
