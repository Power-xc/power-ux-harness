<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css"><script src="timeline.js"></script>
<style>
  /* 릴스 전용 세로 배치: 단계 이름 · 스킬 id · 판정 칩만 크게 */
  .row { position: absolute; left: 150px; width: 700px; height: 52px; display: flex; align-items: center; gap: 18px; }
  .dot { width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; flex: none; position: relative; }
  .dot i { position: absolute; inset: -2px; border-radius: 50%; background: var(--ok); border: 2px solid var(--ok); }
  .step { width: 150px; flex: none; color: var(--muted); font-size: 28px; white-space: nowrap; }
  .sid { width: 340px; flex: none; font: 500 34px var(--mono); color: var(--accent); white-space: nowrap; }
  .chip { height: 44px; padding: 0 20px; font-size: 26px; }
</style></head>
<body><div id="stage">
  <div id="hr" class="hr" style="left:150px;width:700px;top:566px"></div>
  <div id="sum" class="abs" style="left:150px;top:580px;font-size:34px;font-weight:600;white-space:nowrap">먼저 고칠 2건 · 출시 판정 <span class="p1c">FAIL</span></div>
</div>
<script>
const ROWS = [["탐색", "ux-simulate", "가설", "accent"], ["확인", "ux-research", "완료", "ok"], ["정의", "ux-flow", "완료", "ok"], ["설계", "ux-spec", "완료", "ok"],
  ["문구", "ux-writing", "완료", "ok"], ["검토", "ux-review", "P2", "p2"], ["접근성", "ux-a11y", "FAIL", "p1"], ["기만 패턴", "ux-dark-patterns", "P1", "p1"], ["측정", "ux-metrics", "완료", "ok"]];
const T0 = 300, GAP = 550, Y0 = 34, PITCH = 58;
const els = ROWS.map((r, i) => {
  const el = document.createElement("div"); el.className = "row"; el.style.top = (Y0 + i * PITCH) + "px";
  el.innerHTML = `<span class="dot"><i></i></span><span class="step">${r[0]}</span><span class="sid">${r[1]}</span><span class="chip ${r[3]}">${r[2]}</span>`;
  $("stage").insertBefore(el, $("hr")); return el;
});
const SUM = T0 + GAP * 8 + 700;
window.DEMO = defineDemo({ width: 960, height: 670, end: 7000,
  draw(t) {
    els.forEach((el, i) => { const s = T0 + GAP * i; fade(el, t, s); el.querySelector(".dot i").style.opacity = progress(t, s + 300, 160); });
    fade($("hr"), t, SUM); fade($("sum"), t, SUM);
  } });
</script></body></html>
